        <!DOCTYPE html>
<html>
<head>
    <title>Exercise 06</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            height: 200px;
            border: 1px solid black;
            padding: 10px;
            width: 50%;
        }

        .first {
            background-color: #66FFCC;
        }

        .second {
            background-color: #9933CC;
        }

        @media (max-width: 600px) {
            td {
                display: block;
                width: 100%;
                height: 150px;
            }
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
