<!DOCTYPE html>
<html>
<head>
    <title>Exercise 05</title>
    <style>
        table {
            width: 80%;
            margin: 50px auto;
            border-collapse: collapse;
        }

        td {
            height: 150px;
            border: 1px solid black;
            padding: 10px;
        }

        .first {
            background-color: #66FFCC;
        }

        .second {
            background-color: #9933CC;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first">First cell</td>
            <td class="second">Second cell</td>
        </tr>
    </table>

</body>
</html>
